name: Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold
        run: flutter create --platforms=android --org com.easonliu714 --project-name ebo_robot_mcp .
      - name: Prepare optional permanent release signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo 'release=true' >> "$GITHUB_OUTPUT"
          else
            echo 'release=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Android permissions and signing
        run: dart run scripts/configure_android.dart
      - name: Dependencies
        run: flutter pub get
      # flutter create injects a demo test referring to non-existent MyApp.
      # Remove it BEFORE analyze so the app's real tests are checked.
      - name: Remove Flutter scaffold sample test
        run: rm -f test/widget_test.dart
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Automated tests
        run: flutter test
      - name: Build test APK
        run: |
          flutter build apk --debug --build-name=0.1.2 --build-number="$GITHUB_RUN_NUMBER"
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk "artifacts/EBO-v0.1.2-build$GITHUB_RUN_NUMBER-debug.apk"
      - name: Build signed release APK if configured
        if: steps.signing.outputs.release == 'true' && github.event_name != 'pull_request'
        run: |
          flutter build apk --release --build-name=0.1.2 --build-number="$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk "artifacts/EBO-v0.1.2-build$GITHUB_RUN_NUMBER-release.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EBO-Android-v0.1.2-build${{ github.run_number }}
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error
