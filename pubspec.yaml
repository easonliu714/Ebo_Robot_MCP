name: ebo_robot_mcp
description: Secure EBO robot controller for Android
publish_to: none
version: 0.2.1+6

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  record: ^6.2.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Source: user's approved minimal cyan robot/controller icon.
# Executed after "flutter create" in GitHub Actions so the default launcher
# icons and Android 8+ adaptive icon are both replaced.
flutter_launcher_icons:
  android: true
  image_path: assets/icon/ebo_launcher.png
  adaptive_icon_background: "#071A35"
  adaptive_icon_foreground: assets/icon/ebo_launcher.png
  adaptive_icon_foreground_inset: 22
